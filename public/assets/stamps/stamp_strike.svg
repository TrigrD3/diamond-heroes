<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="strikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="45%" stop-color="#e6004c" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>
  <style>
    .stamp-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 76px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      text-anchor: middle;
      paint-order: stroke fill;
    }
  </style>
  <g transform="skewX(-6)" filter="url(#shadow)">
    <text x="160" y="75" class="stamp-text" fill="url(#strikeGrad)" stroke="#000000" stroke-width="10" stroke-linejoin="miter">STRIKE</text>
  </g>
</svg>
