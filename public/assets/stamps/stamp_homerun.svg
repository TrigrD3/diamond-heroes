<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>
  <style>
    .stamp-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 74px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      text-anchor: middle;
      paint-order: stroke fill;
    }
  </style>
  <g transform="skewX(-8)" filter="url(#shadow)">
    <text x="190" y="75" class="stamp-text" fill="url(#hrGrad)" stroke="#000000" stroke-width="11" stroke-linejoin="miter">HOMERUN!</text>
  </g>
</svg>
