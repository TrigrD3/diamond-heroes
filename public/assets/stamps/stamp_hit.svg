<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="hitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="40%" stop-color="#84cc16" />
      <stop offset="85%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>
  <style>
    .stamp-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 58px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1px;
      text-anchor: middle;
      paint-order: stroke fill;
    }
  </style>
  <g transform="skewX(-6)" filter="url(#shadow)">
    <text x="160" y="58" class="stamp-text" fill="url(#hitGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="miter">BASE HIT!</text>
  </g>
</svg>
